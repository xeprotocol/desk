# The filing form and the reporter's account page.
report:
  headline: Report a bug.
  sub: >-
    Tell us what breaks, where, and how to make it happen again. Private reports are sealed on arrival
    and read by the team alone until a fix ships; then the report is disclosed and the thread opens.
  title_hint: What breaks, in one line
  body_hint: >-
    What you did, what happened, what you expected. Versions, commands, transactions, logs. A proof of
    concept if you have one; the clearer the steps, the quicker the triage.
  tier_note: >-
    Your estimate. The team assesses the tier on acceptance and that is the one an award follows.
  private_note: >-
    On for anything that could be used against the network before it is fixed. Critical and severe
    reports are always private whatever you choose. Off is fine for UI bugs, typos and documentation.
  no_vault: >-
    The desk's vault is not open right now, so private reports cannot be sealed. Try again shortly, or
    file in public if the report is safe to read.
  files_note: >-
    Logs, screenshots, a proof of concept. Attachments to a private report are sealed with it. Nothing is
    executed or rendered on the desk; the team downloads and opens files in a sandbox.
  after: You get an id and a page to follow it on. The team reads everything within a day.
  terms_line: Filing accepts the programme rules at
  ask_headline: Ask a question.
  ask_sub: >-
    About running a node, the wallet, the faucet, the testnet or the network. The answer is public and
    stays, so the next person finds it too. Do not put secrets or seeds in a question.
  ask_title_hint: What you want to know, in one line
  ask_body_hint: What you tried, what you saw, which version you are on.
  ask_after: You get an id and a page to follow it on. Answers come from the team and from the community.
  payout_none: >-
    No payout address yet. An accepted report cannot be paid until one is bound, and binding means
    proving you hold the key: a signature from that key, made here in your browser.
  payout_how: >-
    Paste the seed of the address you want paid, or make a new key here. The seed stays in this tab and
    is cleared the moment the signature is made; only the address and the signature reach the desk.

notices:
  private_ticket: >-
    This report is private. Its body and attachments are sealed; only named readers can open them,
    and every opening is in the log.
  in_scope: >-
    This desk is in scope for the bounty from the day it went public. If you find something in it,
    file it like anything else.
  no_poc_in_channels: >-
    Never post a proof of concept into Discord or Telegram. Use the private filing form; the thread
    is for the conversation, not the exploit.

reply_templates:
  patched: |-
    Thanks for the report. This is fixed in {patch_refs}. The desk entry is {ticket_url}. If you can,
    re-run your reproduction against the next testnet build and say so here; if it still reproduces,
    reopen with what you saw.
  duplicate: |-
    Thanks. This is the same finding as {duplicate_url}, which was filed first; the programme pays the
    first verifiable submission, so this one closes as a duplicate. If you believe it is a different
    bug, reply with what differs and we will look again.
  accepted: |-
    Read and accepted at {tier}. It is tracked internally and the fix will land in a public PR; this
    issue is updated when it does. The desk entry is {ticket_url}.
  needs_info: |-
    Read, but not yet reproducible from what is here. Could you add {what}? The desk entry is {ticket_url}.
  invalid: |-
    Read. {reason} Closing; reply here if there is a reproduction we have missed.
  notice: |-
    Noted, and thank you for flagging the campaign ahead of time. Nothing to action from this one.

bots:
  created: "Logged as {ticket_id}. Follow it at {ticket_url}. Replies here go to the same place."
  converted: >-
    This looks like a bug rather than a question, so it has moved to the bounty queue as {ticket_id}.
    Add a payout address at {ticket_url}. Do not post a proof of concept here.
  closed: "Closed: {reason}."

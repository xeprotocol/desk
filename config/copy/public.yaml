# Public register: portal copy, bot messages, reply templates. The copy lint (desk copy-lint) fails the
# build if any kill-list phrase appears here or in a public template. Reply templates must never
# promise an award; that is the kill list's first entry.

site_name: XE Desk
bounty_name: XE Bounty
support_name: XE Support
headline: Find a bug. Earn XE.
sub: >-
  Reports from the bug bounty, in one place: what has been read, what it was assessed as, what is
  fixed, and what is still open. Every ticket is also markdown; every change is in a signed log.
footer: XE Network
footer_line: The bounty desk for the agent-native network, run in the open.
kicker: Bounty
punchline: Read in private. Answered in public. Paid at genesis.
# Pointer shown on the bounty site, for people who arrived with a question rather than a bug.
bounty_crosslink: >-
  Not a bug? Questions about XE, the launch, wallets, keys or getting started go to {support_url}.

# The support site. Its own front door, its own copy: for people who hold XE or want to, who are getting
# started, who have a wallet question or have seen something that looks like a scam. Not for engineers
# and not for security researchers. Nothing about tiers, awards, areas or disclosure appears here.
support:
  headline: Questions about XE, answered in the open.
  punchline: Asked once. Answered for everyone.
  sub: >-
    When does the token launch. How do I get a wallet. I have lost my key. Is this message really from XE.
    Ask here; the team answers in public, the answer stays, and the next person with the same question
    finds it before they need to ask.
  footer_line: Community support for the agent-native network, run in the open.
  crosslink: >-
    Found a way to break the network, steal funds or forge a transaction? That is a security bug, and
    it goes to the bounty at {bounty_url}, in private. Do not post it here.
  ask: Sign in with GitHub, an email link or your XE key; it takes a minute.
  empty: No questions under this heading yet.
  safety_lead: Nobody from XE will ever ask for your seed, private key or password.
  safety: >-
    Not here, not by email, not in a chat. If someone does, it is a scam; say so under Scams and safety
    and the team will warn everyone. Never paste a seed or key into a question.
  topics:
    getting-started: What XE is, how to take part, where the testnet and the explorer are.
    launch-token: Mainnet, genesis, when and how the token becomes available, what is known and what is not.
    wallet-keys: Making a wallet, keeping the seed safe, what can and cannot be recovered.
    sending-receiving: Transactions, addresses, fees, something that did not arrive.
    nodes: Running a node at home or on a server, what it earns, what it needs.
    testnet-faucet: Testnet XE, the faucet, resets and what carries over.
    safety: Impersonators, fake airdrops, phishing. Check before you click.


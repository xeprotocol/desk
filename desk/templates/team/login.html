{% extends "base.html" %}
{% block title %}Team sign-in{% endblock %}
{% block content %}
<div class="login">
<div class="tag"><span>Team</span></div>
<h1>Sign in.</h1>
<p class="sub">A passkey, or the six-digit code from your authenticator. No passwords here. New to the desk? Use the invite link you were sent.</p>
<form class="block" id="login-form" data-next="{{ next }}">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="username webauthn" placeholder="you@xe.network">
  <button type="button" id="passkey-login">Sign in with a passkey</button>
  <div class="or">or</div>
  <label for="code">Code</label>
  <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" maxlength="7">
  <button type="button" class="ghost" id="totp-login">Sign in with the code</button>
  <div class="msg" id="login-msg" style="display:none"></div>
</form>
</div>
{% endblock %}
